<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">Sign up</div>
    <div class="card-body w-full">
        <ul class="steps">
            <li class="step step-primary">Credentials</li>
            <li class="step" [class.step-primary]="currentStep()===2">Profile</li>
        </ul>
        @if (currentStep() === 1) {
        <form [formGroup]="credentialsForm" class="flex flex-col gap-4 w-full steps pt-2">
            <!-- <label class="floating-label">
                <span>Email</span>
                <input type="text" class="input w-full" formControlName="email" placeholder="Email" />
            </label> -->

            <app-text-input label="Email" formControlName="email" type="text" />
            <app-text-input label="Display name" formControlName="displayName" type="text" />
            <app-text-input label="Password" formControlName="password" type="password" />
            <app-text-input label="Confirm Password" formControlName="confirmPassword" type="password" />

            <div class="flex items-center justify-end gap-3">
                <button type="button" class="btn" (click)="cancel()">Cancel</button>
                <button type="button" (click)="nextStep()" class="btn btn-primary"
                    [disabled]="credentialsForm.invalid">Next</button>
            </div>
        </form>
        }
        @if (currentStep() === 2) {
        <form [formGroup]="profileForm" class="flex flex-col gap-4 w-full steps pt-2" (ngSubmit)="register()">
            <div class="flex items-center gap-4">
                <div class="font-semibold">Gender:</div>
                <label class="flex gap-3 items-center">
                    <span>Male</span>
                    <input type="radio" formControlName="gender" value="male" class="radio radio-primary" />
                </label>
                <label class="flex gap-3 items-center">
                    <span>Female</span>
                    <input type="radio" formControlName="gender" value="female" class="radio radio-primary" />
                </label>
            </div>
            <app-text-input label="Date of Birth" formControlName="dateOfBirth" type="date" [maxDate]="getMaxDate()" />
            <app-text-input label="City" formControlName="city" />
            <app-text-input label="Country" formControlName="country" />

            <div class="flex items-center justify-end gap-3">
                <button type="button" class="btn" (click)="prevStep()">Back</button>
                <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">Register</button>
            </div>
        </form>
        }
    </div>
    @if (validationApiErrors().length > 0) {
    <div class="mt-5 flex bg-gray-200 rounded-2xl w-1/2 p-3 m-auto">
        <ul class="flex flex-col text-error space-y-1 m-auto">
            @for (error of validationApiErrors(); track $index) {
            <li>{{error}}</li>
            }
        </ul>
    </div>
    }
</div>
