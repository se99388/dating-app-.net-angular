@if (member();as m){
<div routerLink="/members/{{m.id}}"
    class="card cursor-pointer transition-all ease-in-out transform hover:-translate-y-2">
    <img src="{{m?.imageUrl || '/user.png'}}" alt="{{m.displayName}} image" class="rounded-lg" />
    <div class="card-actions  z-50 absolute bottom-0 w-full px-3 py-1 rounded-b-lg
            bg-linear-to-t from-black to-black/0">
        <div class="flex flex-col text-white">
            <span class="font-semibold">{{m.displayName}}, {{m.dateOfBirth | age}}</span>
            <span class="text-sm">{{m.city}}</span>
        </div>
    </div>
</div>
}
