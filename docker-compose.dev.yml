services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password@1"
    platform: "linux/amd64"
    ports:
      - "1433:1433"
    networks:
      - datingapp-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Password@1" -Q "SELECT 1" -C || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./API
      dockerfile: Dockerfile.dev
    container_name: datingapp-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sql,1433;Database=datingdb;User Id=sa;Password=Password@1;TrustServerCertificate=True
    ports:
      - "5000:5000"
    volumes:
      - ./API:/app
      - /app/bin
      - /app/obj
    depends_on:
      sql:
        condition: service_healthy
    networks:
      - datingapp-network
    command: dotnet watch run --no-launch-profile

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: datingapp-client
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.angular
    depends_on:
      - api
    networks:
      - datingapp-network
    command: ng serve --host 0.0.0.0 --poll 2000

networks:
  datingapp-network:
    driver: bridge
