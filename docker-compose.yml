services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: datingapp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password@1"
    platform: "linux/amd64"
    ports:
      - "1433:1433"
    networks:
      - datingapp-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Password@1" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  cert-generator:
    image: alpine:latest
    container_name: datingapp-cert-generator
    volumes:
      - ./client/ssl:/client/ssl:ro
      - https-certs:/https
    command: sh -c "apk add --no-cache openssl && mkdir -p /https && openssl pkcs12 -export -out /https/aspnetapp.pfx -inkey /client/ssl/localhost-key.pem -in /client/ssl/localhost.pem -passout pass:YourSecurePassword"
    networks:
      - datingapp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datingapp
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:5000
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourSecurePassword
      - ConnectionStrings__DefaultConnection=Server=sql,1433;Database=datingdb;User Id=sa;Password=Password@1;TrustServerCertificate=True
      - TokenKey=a-very-long-secret-key-at-least-64-chars-..........................
    ports:
      - "5000:5000"
    volumes:
      - https-certs:/https:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      sql:
        condition: service_healthy
    networks:
      - datingapp-network

volumes:
  https-certs:


networks:
  datingapp-network:
    driver: bridge
